<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tempo">
  <defs>
    <linearGradient id="tile" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9aabff"/>
      <stop offset="1" stop-color="#4f68e8"/>
    </linearGradient>
  </defs>
  <!-- Tile -->
  <rect width="64" height="64" rx="16" fill="url(#tile)"/>
  <!-- Goal ring: faint track, then three quarters done -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="5"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="80.1 106.8" transform="rotate(-90 32 32)"/>
  <!-- The beat: a clock hand at about two o'clock (a vertical hand into the gap reads as a power button) -->
  <path d="M32 32L38.5 22.8" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3.5" fill="#fff"/>
</svg>
