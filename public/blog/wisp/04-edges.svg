<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img" aria-label="Shared and free screen edges, and how the crossing point carries over">
<title>Shared and free screen edges, and how the crossing point carries over</title>
<rect width="100%" height="100%" rx="14" fill="#fbf8f1"/>
<defs>
  <marker id="ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#12151a"/></marker>
  <marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#0a7c8c"/></marker>
  <marker id="violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#5b3fd1"/></marker>
  <marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/></marker>
</defs>
<text x="36" y="42" font-family="Fraunces, Georgia, serif" font-size="22" fill="#12151a" text-anchor="start" font-weight="normal">Which edges lead to the other computer</text><text x="36" y="66" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13.5" fill="#5b6472" text-anchor="start" font-weight="normal">Wisp only crosses at an edge with no screen beyond it, on the side you chose.</text><rect x="40" y="132" width="170" height="104" rx="6" fill="#d9f2ef" stroke="#12151a" stroke-width="2"/><text x="125" y="190" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#12151a" text-anchor="middle" font-weight="600">screen 1</text><rect x="210" y="108" width="220" height="150" rx="6" fill="#d9f2ef" stroke="#12151a" stroke-width="2"/><text x="320" y="190" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#12151a" text-anchor="middle" font-weight="600">screen 2</text><text x="235" y="290" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#0a7c8c" text-anchor="middle" font-weight="600">SHARING COMPUTER</text><line x1="210" y1="134" x2="210" y2="234" stroke="#b45309" stroke-width="5"/><line x1="430" y1="110" x2="430" y2="256" stroke="#5b3fd1" stroke-width="5"/><circle cx="430" cy="171.0" r="6" fill="#5b3fd1"/><rect x="560" y="120" width="220" height="130" rx="6" fill="#e7e1fb" stroke="#12151a" stroke-width="2"/><text x="670" y="190" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#12151a" text-anchor="middle" font-weight="600">Mac screen</text><text x="670" y="290" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#5b3fd1" text-anchor="middle" font-weight="600">RECEIVING COMPUTER</text><line x1="560" y1="122" x2="560" y2="248" stroke="#5b3fd1" stroke-width="5"/><circle cx="560" cy="174.6" r="6" fill="#5b3fd1"/><path d="M436,171.0 C480,145.0 512,148.6 552,174.6" stroke="#5b3fd1" stroke-width="2" fill="none" marker-end="url(#violet)" stroke-dasharray="6 5"/><text x="495" y="137.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#21135a" text-anchor="middle" font-weight="normal">r = 0.42</text><line x1="40" y1="328" x2="70" y2="328" stroke="#b45309" stroke-width="5"/><text x="82" y="333" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#12151a" text-anchor="start" font-weight="normal">Shared edge: another screen on this computer lies beyond it,</text><text x="82" y="351" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#12151a" text-anchor="start" font-weight="normal">so the pointer moves there as usual.</text><line x1="40" y1="388" x2="70" y2="388" stroke="#5b3fd1" stroke-width="5"/><text x="82" y="393" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#12151a" text-anchor="start" font-weight="normal">Free edge on the chosen side: the pointer crosses here. Wisp sends</text><text x="82" y="411" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#12151a" text-anchor="start" font-weight="normal">how far along the edge it was (0 is the top, 1 is the bottom), and</text><text x="82" y="429" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#12151a" text-anchor="start" font-weight="normal">the other computer enters at the same fraction of its own edge.</text>
</svg>
