<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-label="How Wisp finds sharing computers on the network">
<title>How Wisp finds sharing computers on the network</title>
<rect width="100%" height="100%" rx="14" fill="#fbf8f1"/>
<defs>
  <marker id="ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#12151a"/></marker>
  <marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#0a7c8c"/></marker>
  <marker id="violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#5b3fd1"/></marker>
  <marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/></marker>
</defs>
<text x="36" y="42" font-family="Fraunces, Georgia, serif" font-size="22" fill="#12151a" text-anchor="start" font-weight="normal">Finding the other computer</text><text x="36" y="66" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13.5" fill="#5b6472" text-anchor="start" font-weight="normal">A broadcast asks who is sharing. The pairing code stays on the sharing computer's screen.</text><rect x="40" y="96" width="200" height="64" rx="10" fill="#e7e1fb" stroke="#12151a" stroke-width="1.6"/><text x="140.0" y="124.75" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Receiving computer</text><text x="140.0" y="144.25" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">presses Find</text><rect x="580" y="96" width="200" height="64" rx="10" fill="#d9f2ef" stroke="#12151a" stroke-width="1.6"/><text x="680.0" y="124.75" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">DESKTOP-1</text><text x="680.0" y="144.25" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">sharing, 192.168.1.50</text><rect x="580" y="200" width="200" height="64" rx="10" fill="#d9f2ef" stroke="#12151a" stroke-width="1.6"/><text x="680.0" y="228.75" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">studio-mac</text><text x="680.0" y="248.25" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">sharing, 192.168.1.77</text><line x1="244" y1="118" x2="574" y2="118" stroke="#5b3fd1" stroke-width="1.8" marker-end="url(#violet)"/><line x1="244" y1="136" x2="574" y2="214" stroke="#5b3fd1" stroke-width="1.8" marker-end="url(#violet)"/><text x="410" y="106" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#21135a" text-anchor="middle" font-weight="normal">broadcast  "KMSHARE?"  to UDP 24801</text><line x1="576" y1="150" x2="248" y2="150" stroke="#0a7c8c" stroke-width="1.8" marker-end="url(#teal)" stroke-dasharray="6 5"/><text x="420" y="172" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#0a7c8c" text-anchor="middle" font-weight="normal">reply  "KMSHARE!" + {"name", "port"}</text><text x="420" y="190" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle" font-weight="normal" font-style="italic">(the message name comes from the project's old name)</text><rect x="40" y="300" width="740" height="92" rx="12" fill="#ebe7dd" stroke="#d4cec0" stroke-width="1.6"/><text x="60" y="328" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#12151a" text-anchor="start" font-weight="normal">Then you pick a computer from the list and type the 6-digit code shown on its screen.</text><text x="60" y="350" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#12151a" text-anchor="start" font-weight="normal">Wisp opens a TCP connection to port 24800 and sends the code in its first message.</text><text x="60" y="372" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#12151a" text-anchor="start" font-weight="normal">The sharing computer drops the connection if the code is wrong.</text>
</svg>
