<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="630" viewBox="0 0 820 630" role="img" aria-label="The messages Wisp sends between the two computers">
<title>The messages Wisp sends between the two computers</title>
<rect width="100%" height="100%" rx="14" fill="#fbf8f1"/>
<defs>
  <marker id="ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#12151a"/></marker>
  <marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#0a7c8c"/></marker>
  <marker id="violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#5b3fd1"/></marker>
  <marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/></marker>
</defs>
<text x="36" y="42" font-family="Fraunces, Georgia, serif" font-size="22" fill="#12151a" text-anchor="start" font-weight="normal">What the two computers say to each other</text><text x="36" y="66" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13.5" fill="#5b6472" text-anchor="start" font-weight="normal">Newline-delimited JSON over one TCP connection. Real message shapes, shortened.</text><rect x="60" y="88" width="180" height="40" rx="10" fill="#d9f2ef" stroke="#12151a" stroke-width="1.6"/><text x="150.0" y="113.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Sharing computer</text><rect x="580" y="88" width="180" height="40" rx="10" fill="#e7e1fb" stroke="#12151a" stroke-width="1.6"/><text x="670.0" y="113.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Receiving computer</text><line x1="150" y1="130" x2="150" y2="600" stroke="#d4cec0" stroke-width="2" stroke-dasharray="4 5"/><line x1="670" y1="130" x2="670" y2="600" stroke="#d4cec0" stroke-width="2" stroke-dasharray="4 5"/><line x1="666" y1="168" x2="158" y2="168" stroke="#5b3fd1" stroke-width="1.8" marker-end="url(#violet)"/><text x="410.0" y="160" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#12151a" text-anchor="middle" font-weight="normal">{"t":"hello","token":"482913","os":"Darwin"}</text><text x="410.0" y="185" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle" font-weight="normal" font-style="italic">receiver connects and gives the code</text><line x1="154" y1="218" x2="662" y2="218" stroke="#0a7c8c" stroke-width="1.8" marker-end="url(#teal)"/><text x="410.0" y="210" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#12151a" text-anchor="middle" font-weight="normal">{"t":"hello","os":"Windows","name":"DESKTOP-1"}</text><text x="410.0" y="235" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle" font-weight="normal" font-style="italic">code accepted</text><line x1="154" y1="268" x2="662" y2="268" stroke="#0a7c8c" stroke-width="1.8" marker-end="url(#teal)"/><text x="410.0" y="260" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#12151a" text-anchor="middle" font-weight="normal">{"t":"enter","r":0.42}</text><text x="410.0" y="285" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle" font-weight="normal" font-style="italic">pointer crossed, 42% down the edge</text><line x1="154" y1="318" x2="662" y2="318" stroke="#0a7c8c" stroke-width="1.8" marker-end="url(#teal)"/><text x="410.0" y="310" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#12151a" text-anchor="middle" font-weight="normal">{"t":"m","dx":5,"dy":-2}</text><text x="410.0" y="335" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle" font-weight="normal" font-style="italic">mouse moved</text><line x1="154" y1="368" x2="662" y2="368" stroke="#0a7c8c" stroke-width="1.8" marker-end="url(#teal)"/><text x="410.0" y="360" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#12151a" text-anchor="middle" font-weight="normal">{"t":"b","b":"left","p":true}</text><text x="410.0" y="385" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle" font-weight="normal" font-style="italic">left button pressed</text><line x1="154" y1="418" x2="662" y2="418" stroke="#0a7c8c" stroke-width="1.8" marker-end="url(#teal)"/><text x="410.0" y="410" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#12151a" text-anchor="middle" font-weight="normal">{"t":"k","n":"c","p":true,"q":17}</text><text x="410.0" y="435" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle" font-weight="normal" font-style="italic">key c pressed, 17th key event</text><line x1="154" y1="468" x2="662" y2="468" stroke="#0a7c8c" stroke-width="1.8" marker-end="url(#teal)"/><text x="410.0" y="460" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#12151a" text-anchor="middle" font-weight="normal">{"t":"ping","held":["ctrl"]}</text><text x="410.0" y="485" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle" font-weight="normal" font-style="italic">every second: keys still held down</text><line x1="666" y1="518" x2="158" y2="518" stroke="#5b3fd1" stroke-width="1.8" marker-end="url(#violet)"/><text x="410.0" y="510" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#12151a" text-anchor="middle" font-weight="normal">{"t":"pong"}</text><text x="410.0" y="535" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle" font-weight="normal" font-style="italic">receiver answers, giving the round-trip time</text><line x1="666" y1="568" x2="158" y2="568" stroke="#5b3fd1" stroke-width="1.8" marker-end="url(#violet)"/><text x="410.0" y="560" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#12151a" text-anchor="middle" font-weight="normal">{"t":"leave","r":0.61}</text><text x="410.0" y="585" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#5b6472" text-anchor="middle" font-weight="normal" font-style="italic">pointer crossed back, control returns to the sharer</text>
</svg>
