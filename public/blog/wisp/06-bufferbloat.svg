<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-label="Router queueing delays Wisp's small packets behind a download">
<title>Router queueing delays Wisp's small packets behind a download</title>
<rect width="100%" height="100%" rx="14" fill="#fbf8f1"/>
<defs>
  <marker id="ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#12151a"/></marker>
  <marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#0a7c8c"/></marker>
  <marker id="violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#5b3fd1"/></marker>
  <marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/></marker>
</defs>
<text x="36" y="42" font-family="Fraunces, Georgia, serif" font-size="22" fill="#12151a" text-anchor="start" font-weight="normal">Why a download makes the mouse lag</text><text x="36" y="66" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13.5" fill="#5b6472" text-anchor="start" font-weight="normal">Every packet waits its turn in the router's queue, and small ones get no shortcut.</text><rect x="40" y="110" width="150" height="64" rx="10" fill="#d9f2ef" stroke="#12151a" stroke-width="1.6"/><text x="115.0" y="147.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Sharing computer</text><rect x="630" y="110" width="150" height="64" rx="10" fill="#e7e1fb" stroke="#12151a" stroke-width="1.6"/><text x="705.0" y="147.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Receiving computer</text><rect x="232" y="96" width="356" height="92" rx="12" fill="#ebe7dd" stroke="#12151a" stroke-width="1.6"/><text x="410" y="90" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#12151a" text-anchor="middle" font-weight="600">Wi-Fi router queue</text><rect x="248" y="112" width="38" height="60" rx="4" fill="#cfc8b8" stroke="#5b6472" stroke-width="1.2"/><rect x="294" y="112" width="38" height="60" rx="4" fill="#cfc8b8" stroke="#5b6472" stroke-width="1.2"/><rect x="340" y="112" width="38" height="60" rx="4" fill="#cfc8b8" stroke="#5b6472" stroke-width="1.2"/><rect x="386" y="112" width="38" height="60" rx="4" fill="#cfc8b8" stroke="#5b6472" stroke-width="1.2"/><rect x="432" y="112" width="38" height="60" rx="4" fill="#cfc8b8" stroke="#5b6472" stroke-width="1.2"/><rect x="478" y="112" width="38" height="60" rx="4" fill="#cfc8b8" stroke="#5b6472" stroke-width="1.2"/><rect x="524" y="112" width="38" height="60" rx="4" fill="#cfc8b8" stroke="#5b6472" stroke-width="1.2"/><rect x="572" y="132" width="10" height="20" rx="2" fill="#5b3fd1"/><line x1="194" y1="142" x2="228" y2="142" stroke="#12151a" stroke-width="1.8" marker-end="url(#ink)"/><line x1="592" y1="142" x2="626" y2="142" stroke="#12151a" stroke-width="1.8" marker-end="url(#ink)"/><text x="267" y="206" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="normal">download data</text><path d="M577,156 L577,214 L520,214" stroke="#5b3fd1" stroke-width="1.4" fill="none"/><text x="512" y="219" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b3fd1" text-anchor="end" font-weight="600">a mouse move</text><text x="40" y="262" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#12151a" text-anchor="start" font-weight="normal">A mouse move is a few dozen bytes. A large download can keep the queue full,</text><text x="40" y="283" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#12151a" text-anchor="start" font-weight="normal">so each move waits behind it. On this network that meant 300 ms or more.</text><text x="40" y="332" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#0a7c8c" text-anchor="start" font-weight="600">WITH A CABLE BETWEEN THE TWO COMPUTERS</text><rect x="40" y="348" width="150" height="52" rx="10" fill="#d9f2ef" stroke="#12151a" stroke-width="1.6"/><text x="115.0" y="379.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Sharing</text><rect x="630" y="348" width="150" height="52" rx="10" fill="#e7e1fb" stroke="#12151a" stroke-width="1.6"/><text x="705.0" y="379.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Receiving</text><line x1="194" y1="374" x2="626" y2="374" stroke="#0a7c8c" stroke-width="5"/><rect x="404" y="366" width="10" height="16" rx="2" fill="#5b3fd1"/><text x="410" y="400" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#0a7c8c" text-anchor="middle" font-weight="normal">a private link with nothing else in the queue: under 1 ms</text>
</svg>
