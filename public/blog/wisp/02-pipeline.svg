<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" role="img" aria-label="The path of one keystroke through Wisp">
<title>The path of one keystroke through Wisp</title>
<rect width="100%" height="100%" rx="14" fill="#fbf8f1"/>
<defs>
  <marker id="ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#12151a"/></marker>
  <marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#0a7c8c"/></marker>
  <marker id="violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#5b3fd1"/></marker>
  <marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/></marker>
</defs>
<text x="36" y="42" font-family="Fraunces, Georgia, serif" font-size="22" fill="#12151a" text-anchor="start" font-weight="normal">One keystroke, end to end</text><text x="36" y="66" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13.5" fill="#5b6472" text-anchor="start" font-weight="normal">Each box is one part of wisp.py. Both computers run the same file.</text><text x="36" y="104" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#0a7c8c" text-anchor="start" font-weight="600">SHARING COMPUTER</text><rect x="36" y="116" width="168" height="76" rx="10" fill="#ebe7dd" stroke="#12151a" stroke-width="1.6"/><text x="120.0" y="150.75" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Keyboard &amp; mouse</text><text x="120.0" y="170.25" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">the real hardware</text><rect x="230" y="116" width="168" height="76" rx="10" fill="#d9f2ef" stroke="#12151a" stroke-width="1.6"/><text x="314.0" y="142.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Input hook</text><text x="314.0" y="161.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">Windows: low-level hook</text><text x="314.0" y="179.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">Mac: event tap</text><line x1="206" y1="154" x2="226" y2="154" stroke="#12151a" stroke-width="1.8" marker-end="url(#ink)"/><rect x="424" y="116" width="168" height="76" rx="10" fill="#d9f2ef" stroke="#12151a" stroke-width="1.6"/><text x="508.0" y="142.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Here or there?</text><text x="508.0" y="161.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">here: pass it to apps</text><text x="508.0" y="179.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">there: block it, send it</text><line x1="400" y1="154" x2="420" y2="154" stroke="#12151a" stroke-width="1.8" marker-end="url(#ink)"/><rect x="618" y="116" width="168" height="76" rx="10" fill="#d9f2ef" stroke="#12151a" stroke-width="1.6"/><text x="702.0" y="142.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Send queue</text><text x="702.0" y="161.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">merges mouse moves</text><text x="702.0" y="179.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">into one message</text><line x1="594" y1="154" x2="614" y2="154" stroke="#12151a" stroke-width="1.8" marker-end="url(#ink)"/><rect x="36" y="236" width="748" height="46" rx="23" fill="#e7e1fb" stroke="#5b3fd1" stroke-width="1.6"/><text x="410" y="264" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#21135a" text-anchor="middle" font-weight="normal">{"t": "k", "n": "c", "p": true, "q": 17}   one JSON line per event</text><line x1="702.0" y1="194" x2="702.0" y2="232" stroke="#5b3fd1" stroke-width="1.8" marker-end="url(#violet)"/><line x1="180" y1="284" x2="180" y2="322" stroke="#5b3fd1" stroke-width="1.8" marker-end="url(#violet)"/><text x="36" y="314" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11.5" fill="#5b3fd1" text-anchor="start" font-weight="600">RECEIVING COMPUTER</text><rect x="36" y="326" width="168" height="76" rx="10" fill="#e7e1fb" stroke="#12151a" stroke-width="1.6"/><text x="120.0" y="360.75" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Read socket</text><text x="120.0" y="380.25" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">one line, one event</text><rect x="230" y="326" width="168" height="76" rx="10" fill="#e7e1fb" stroke="#12151a" stroke-width="1.6"/><text x="314.0" y="352.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Client core</text><text x="314.0" y="371.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">tracks pointer, keys,</text><text x="314.0" y="389.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">screen edges</text><line x1="206" y1="364" x2="226" y2="364" stroke="#12151a" stroke-width="1.8" marker-end="url(#ink)"/><rect x="424" y="326" width="168" height="76" rx="10" fill="#e7e1fb" stroke="#12151a" stroke-width="1.6"/><text x="508.0" y="352.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Injector</text><text x="508.0" y="371.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">Windows: SendInput</text><text x="508.0" y="389.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">Mac: CGEventPost</text><line x1="400" y1="364" x2="420" y2="364" stroke="#12151a" stroke-width="1.8" marker-end="url(#ink)"/><rect x="618" y="326" width="168" height="76" rx="10" fill="#ebe7dd" stroke="#12151a" stroke-width="1.6"/><text x="702.0" y="352.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Apps</text><text x="702.0" y="371.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">see a normal</text><text x="702.0" y="389.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">keyboard &amp; mouse</text><line x1="594" y1="364" x2="614" y2="364" stroke="#12151a" stroke-width="1.8" marker-end="url(#ink)"/><text x="36" y="440.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="normal">When Wisp blocks an event, apps on the sharing computer never see it.</text><text x="36" y="457.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="normal">When the event stays on the sharing computer, Wisp sends nothing.</text>
</svg>
