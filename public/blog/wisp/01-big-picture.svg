<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-label="Wisp: the sharing computer sends its input to the receiving computer">
<title>Wisp: the sharing computer sends its input to the receiving computer</title>
<rect width="100%" height="100%" rx="14" fill="#fbf8f1"/>
<defs>
  <marker id="ink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#12151a"/></marker>
  <marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#0a7c8c"/></marker>
  <marker id="violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#5b3fd1"/></marker>
  <marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/></marker>
</defs>
<text x="36" y="42" font-family="Fraunces, Georgia, serif" font-size="22" fill="#12151a" text-anchor="start" font-weight="normal">The big picture</text><text x="36" y="66" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13.5" fill="#5b6472" text-anchor="start" font-weight="normal">The pointer moves from one computer to the other at a screen edge.</text><rect x="48" y="100" width="250" height="150" rx="8" fill="#d9f2ef" stroke="#12151a" stroke-width="2"/><rect x="157.0" y="250" width="32" height="14" fill="#ebe7dd" stroke="#12151a" stroke-width="1.6"/><rect x="127.0" y="264" width="92" height="7" rx="3" fill="#ebe7dd" stroke="#12151a" stroke-width="1.6"/><text x="173.0" y="130" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Sharing computer</text><text x="173.0" y="150" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">has the keyboard &amp; mouse</text><rect x="78" y="300" width="150" height="30" rx="6" fill="#ebe7dd" stroke="#12151a" stroke-width="1.6"/><rect x="88" y="308" width="10" height="6" rx="1.5" fill="#fbf8f1" stroke="#12151a" stroke-width="1"/><rect x="103" y="308" width="10" height="6" rx="1.5" fill="#fbf8f1" stroke="#12151a" stroke-width="1"/><rect x="118" y="308" width="10" height="6" rx="1.5" fill="#fbf8f1" stroke="#12151a" stroke-width="1"/><rect x="133" y="308" width="10" height="6" rx="1.5" fill="#fbf8f1" stroke="#12151a" stroke-width="1"/><rect x="148" y="308" width="10" height="6" rx="1.5" fill="#fbf8f1" stroke="#12151a" stroke-width="1"/><rect x="163" y="308" width="10" height="6" rx="1.5" fill="#fbf8f1" stroke="#12151a" stroke-width="1"/><rect x="178" y="308" width="10" height="6" rx="1.5" fill="#fbf8f1" stroke="#12151a" stroke-width="1"/><rect x="193" y="308" width="10" height="6" rx="1.5" fill="#fbf8f1" stroke="#12151a" stroke-width="1"/><rect x="208" y="308" width="10" height="6" rx="1.5" fill="#fbf8f1" stroke="#12151a" stroke-width="1"/><rect x="108" y="318" width="90" height="6" rx="1.5" fill="#fbf8f1" stroke="#12151a" stroke-width="1"/><ellipse cx="258" cy="315" rx="15" ry="20" fill="#ebe7dd" stroke="#12151a" stroke-width="1.6"/><line x1="258" y1="297" x2="258" y2="308" stroke="#12151a" stroke-width="1.4"/><rect x="522" y="100" width="250" height="150" rx="8" fill="#d9f2ef" stroke="#12151a" stroke-width="2"/><rect x="631.0" y="250" width="32" height="14" fill="#ebe7dd" stroke="#12151a" stroke-width="1.6"/><rect x="601.0" y="264" width="92" height="7" rx="3" fill="#ebe7dd" stroke="#12151a" stroke-width="1.6"/><text x="647.0" y="130" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#12151a" text-anchor="middle" font-weight="600">Receiving computer</text><text x="647.0" y="150" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">no keyboard or mouse of its own</text><path d="M150,205 C200,195 250,182 296,176" stroke="#5b3fd1" stroke-width="2.2" fill="none" stroke-dasharray="6 5"/><polygon points="146.0,196.0 146.0,213.0 150.0,209.0 153.2,216.0 156.0,214.8 153.0,208.0 158.5,208.0" fill="#ffffff" stroke="#12151a" stroke-width="1.4" stroke-linejoin="round"/><path d="M524,176 C560,172 600,188 640,206" stroke="#5b3fd1" stroke-width="2.2" fill="none" marker-end="url(#violet)" stroke-dasharray="6 5"/><polygon points="640.0,200.0 640.0,217.0 644.0,213.0 647.2,220.0 650.0,218.8 647.0,212.0 652.5,212.0" fill="#e7e1fb" stroke="#5b3fd1" stroke-width="1.4" stroke-linejoin="round"/><line x1="297" y1="110" x2="297" y2="240" stroke="#5b3fd1" stroke-width="4"/><line x1="523" y1="110" x2="523" y2="240" stroke="#5b3fd1" stroke-width="4"/><rect x="330" y="150" width="160" height="60" rx="30" fill="#e7e1fb" stroke="#5b3fd1" stroke-width="1.6"/><text x="410" y="175" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13.5" fill="#21135a" text-anchor="middle" font-weight="600">local network</text><text x="410" y="194" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" fill="#21135a" text-anchor="middle" font-weight="normal">TCP port 24800</text><line x1="300" y1="162" x2="326" y2="162" stroke="#5b3fd1" stroke-width="1.8" marker-end="url(#violet)"/><line x1="494" y1="162" x2="518" y2="162" stroke="#5b3fd1" stroke-width="1.8" marker-end="url(#violet)"/><text x="410" y="238" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="middle" font-weight="normal">your input, one event at a time</text><text x="48" y="372.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="normal">The real keyboard and mouse stay connected here.</text><text x="48" y="389.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="normal">Wisp blocks their events while the pointer</text><text x="48" y="407.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="normal">is on the other computer.</text><text x="522" y="372.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="normal">Wisp replays each event here, so apps see</text><text x="522" y="389.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="normal">an ordinary keyboard and mouse.</text>
</svg>
