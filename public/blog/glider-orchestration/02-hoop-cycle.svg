  <text x="40" y="36" font-family="Fraunces, Georgia, serif" font-size="22" fill="#0f172a">Hoop cycle (Loop Engineering)</text><text x="40" y="62" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#64748b">Main path ↓ · optional pause on the right · next round loops up</text><rect x="100.0" y="90" width="320" height="58" rx="12" fill="#bae6fd" stroke="#1e3a5f" stroke-width="2"/><text x="260.0" y="110.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">1  workspace</text><text x="260.0" y="128.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">scratch + output folders for this run</text><rect x="100.0" y="184" width="320" height="58" rx="12" fill="#c7d2fe" stroke="#1e3a5f" stroke-width="2"/><text x="260.0" y="204.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">2  planner</text><text x="260.0" y="222.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">decide what to do (text plan)</text><rect x="100.0" y="278" width="320" height="58" rx="12" fill="#bbf7d0" stroke="#1e3a5f" stroke-width="2"/><text x="260.0" y="298.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">3  actor</text><text x="260.0" y="316.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">do the work (tools / writes)</text><rect x="100.0" y="372" width="320" height="58" rx="12" fill="#fde68a" stroke="#1e3a5f" stroke-width="2"/><text x="260.0" y="392.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">4  critic</text><text x="260.0" y="410.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">score the result (SCORE:)</text><rect x="100.0" y="466" width="320" height="58" rx="12" fill="#fbcfe8" stroke="#1e3a5f" stroke-width="2"/><text x="260.0" y="486.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">5  memory</text><text x="260.0" y="504.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">save what happened</text><line x1="260" y1="148" x2="260" y2="184" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="260" y1="242" x2="260" y2="278" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="260" y1="336" x2="260" y2="372" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="260" y1="430" x2="260" y2="466" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="520" y="372" width="260" height="58" rx="12" fill="#fecaca" stroke="#1e3a5f" stroke-width="2"/><text x="650.0" y="392.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">human_gate</text><text x="650.0" y="410.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">pause for a person</text><line x1="420.0" y1="401.0" x2="520" y2="401.0" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><text x="470.0" y="387.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#334155">if review needed</text><line x1="650" y1="430" x2="650" y2="486" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="650" y1="495" x2="420.0" y2="495" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="100.0" y1="495.0" x2="70" y2="495.0" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#af)"/><line x1="70" y1="495.0" x2="70" y2="119.0" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#af)"/><text x="60.0" y="307.0" text-anchor="end" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#c2410c">next round</text><line x1="70" y1="119.0" x2="100.0" y2="119.0" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#af)"/><rect x="120" y="580" width="560" height="48" rx="12" fill="#e2e8f0" stroke="#1e3a5f" stroke-width="2"/><text x="400.0" y="604.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#1e3a5f">feeds (optional): one step’s summary is pasted into a later step’s prompt</text>
