  <text x="40" y="36" font-family="Fraunces, Georgia, serif" font-size="22" fill="#0f172a">Repo security audit hoop — happy path</text><text x="40" y="62" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#64748b">Read top → bottom. Orange dashed = try again / ask a human again.</text><rect x="90.0" y="88" width="420" height="48" rx="12" fill="#bbf7d0" stroke="#1e3a5f" stroke-width="2"/><text x="300.0" y="112.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">1  memory — load notes from last time (if any)</text><rect x="90.0" y="158" width="420" height="48" rx="12" fill="#c7d2fe" stroke="#1e3a5f" stroke-width="2"/><text x="300.0" y="182.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">2  router — prefer local model for this job</text><rect x="90.0" y="228" width="420" height="48" rx="12" fill="#bae6fd" stroke="#1e3a5f" stroke-width="2"/><text x="300.0" y="252.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">3  planner — short checklist only (no clone yet)</text><rect x="90.0" y="298" width="420" height="48" rx="12" fill="#bbf7d0" stroke="#1e3a5f" stroke-width="2"/><text x="300.0" y="322.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">4  actor — clone the repo into work/audit-target</text><rect x="90.0" y="368" width="420" height="48" rx="12" fill="#bbf7d0" stroke="#1e3a5f" stroke-width="2"/><text x="300.0" y="392.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">5  actor — verify the clone folder is really there</text><rect x="90.0" y="438" width="420" height="48" rx="12" fill="#a5f3fc" stroke="#1e3a5f" stroke-width="2"/><text x="300.0" y="462.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">6  context — write shared “clone lives here” facts</text><rect x="90.0" y="508" width="420" height="48" rx="12" fill="#bbf7d0" stroke="#1e3a5f" stroke-width="2"/><text x="300.0" y="532.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">7  actor — parallel quality + security helpers</text><rect x="90.0" y="578" width="420" height="48" rx="12" fill="#fecaca" stroke="#1e3a5f" stroke-width="2"/><text x="300.0" y="602.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">8  human_gate — person reviews findings</text><rect x="90.0" y="648" width="420" height="48" rx="12" fill="#fde68a" stroke="#1e3a5f" stroke-width="2"/><text x="300.0" y="672.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">9  critic — SCORE: is the audit usable?</text><rect x="90.0" y="718" width="420" height="48" rx="12" fill="#fbcfe8" stroke="#1e3a5f" stroke-width="2"/><text x="300.0" y="742.0" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#1e3a5f">10 memory — save this cycle’s result</text><line x1="300" y1="136" x2="300" y2="158" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="206" x2="300" y2="228" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="276" x2="300" y2="298" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="346" x2="300" y2="368" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="416" x2="300" y2="438" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="486" x2="300" y2="508" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="556" x2="300" y2="578" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="626" x2="300" y2="648" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="300" y1="696" x2="300" y2="718" stroke="#334155" strok